<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Estoque</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="login-container">
        <section class="login-form-box">
            <h2>Login</h2>
            <form action="#" method="POST" class="login-form">
                <div class="input-group">
                    <label for="username">Admin/usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-links">
                    <a href="#" class="form-link">Alterar senha</a>
                    <a href="#" class="form-link">Esqueceu a senha</a>
                </div>

                <button type="submit" class="login-button">Entrar</button>

                <p class="register-text">
                    Ainda não tem uma conta? <a href="/register.html">Registe-se aqui</a>
                </p>
            </form>
        </section>
    </main>

</body>
</html>
