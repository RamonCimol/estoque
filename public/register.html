<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - Gerenciador de Estoque</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="register-container">
        <section class="register-form-box">
            <h2>Registar Utilizador</h2>
            <form id="registerForm" class="register-form">
                <div class="input-group">
                    <label for="new-username">Utilizador</label>
                    <input type="text" id="new-username" name="new-username" required>
                </div>
                <div class="input-group">
                    <label for="new-password">Senha</label>
                    <input type="password" id="new-password" name="new-password" required>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit" class="register-button">Registar</button>
            </form>
            <p class="login-text">Já tem uma conta? <a href="/login.html">Faça login</a></p>
        </section>
    </main>
    <script src="./js/register.js"></script>
</body>
</html>
